<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Split the bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6edf1;--paper:#fff;--ink:#17283b;--mute:#5d6f80;--line:#c4d0d8;--acc:#0b8a70;--accbg:#dcf5ee;--onacc:#fff;--warn:#b86e00;--warnbg:#fff1d6;--bad:#d9480f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1820;--paper:#18252f;--ink:#e8eff4;--mute:#93a5b3;--line:#32444f;--acc:#3ddbb4;--accbg:#12372f;--onacc:#06241c;--warn:#f0b24a;--warnbg:#3a2c0f;--bad:#ff8a5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding:0 0 96px}
#app{max-width:560px;margin:0 auto;padding:0 12px}
h1{font-size:1.6rem;font-weight:800;margin:.4em 0 .2em;letter-spacing:-.02em}
h2{font-size:1.05rem;font-weight:800;margin:0 0 .5em}
.card{background:var(--paper);border-radius:6px;padding:14px 16px;margin:12px 0;box-shadow:0 0 0 1px var(--line)}
.m{color:var(--mute);font-size:.9rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:2px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .n{flex:1;min-width:0}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
button,select,input{font:inherit;color:inherit}
button{background:var(--acc);color:var(--onacc);border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
button.x{background:transparent;color:var(--bad);padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.item:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select{background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0}
.f{display:flex;gap:8px;margin-top:8px}.f input:first-child{flex:1}.f input[type=number]{width:96px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:99px;padding:7px 14px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;font-weight:600;border:0;color:var(--ink)}
.chip.on{background:var(--acc);color:var(--onacc);box-shadow:none}
.item{cursor:pointer}
.item.mine{background:var(--accbg);margin:0 -16px;padding:9px 16px}
.tag{display:inline-block;font-size:.8rem;border-radius:4px;padding:1px 7px;background:var(--warnbg);color:var(--warn);font-weight:600}
.big{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
a{color:var(--acc);font-weight:600}
.pos{color:var(--acc)}.neg{color:var(--bad)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hd{margin:0 -12px 12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 18px;background:var(--acc);color:var(--onacc)}
.hd h1{margin:.2em 0 0;color:inherit}.hd a{color:inherit;font-weight:600;text-decoration:none}.hd .m{color:inherit;opacity:.92;margin:.2em 0 0}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:max(20px,env(safe-area-inset-bottom));border-radius:99px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:5}
.seg{display:flex;margin:12px 0}.seg button{flex:1;background:var(--paper);color:var(--ink);border-radius:0;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}.seg button.on{background:var(--acc);color:var(--onacc)}
a.ex,.row.ex{color:var(--ink);text-decoration:none;font-weight:400}a.n.ex{display:flex;align-items:center;font-weight:600}
.av{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:8px;background:var(--accbg);color:var(--acc);font-weight:800;margin-right:10px;flex:none}
.dt{width:34px;text-align:center;font-size:.75rem;color:var(--mute);line-height:1.15;flex:none}.dt b{font-size:1.05rem;color:var(--ink)}
.st{text-align:right;font-size:.8rem;white-space:nowrap}.st b{display:block;font-size:1rem}
.dd{background:var(--bg);border-radius:6px;padding:4px 12px 10px;margin:6px 0 10px;box-shadow:inset 0 0 0 1.5px var(--line);max-height:60vh;overflow:auto}.dd .row{padding:8px 0}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ====== PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings > Your apps > Web) ======
const CFG = { apiKey: "AIzaSyAFVezfimw-kP3_tq-b3DuJ1jP0agB20NM", authDomain: "bill-split-b622d.firebaseapp.com", projectId: "bill-split-b622d", appId: "1:408745893445:web:832f4188ae4b62eb154d2c" };
// =======================================================================================================

const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm = n => 'RM ' + (Math.round(n * 100) / 100).toFixed(2);
const rid = () => Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 5);
const ls = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const link = (t, id) => location.href.split('#')[0] + '#/' + t + '/' + id;
const copy = async (txt, btn) => {
  try { await navigator.clipboard.writeText(txt); if (btn) { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = o, 1400); } }
  catch { prompt('Copy this:', txt); }
};
function addHist(t, id, name) {
  const h = ls.get('hist', []).filter(x => x.id !== id);
  h.unshift({ t, id, name });
  ls.set('hist', h.slice(0, 200));
}

// ---------- maths ----------
function splitOK(i) {
  const c = i.claims || [], x = i.split;
  return !!x && c.length > 1 && Object.keys(x).length === c.length && c.every(n => n in x) && Math.abs(c.reduce((a, n) => a + x[n], 0) - 100) < 0.01;
}
function calc(b) {
  const items = Object.values(b.items || {});
  const f = (1 + (b.svc || 0) / 100) * (1 + (b.tax || 0) / 100);
  const per = {}, names = {};
  let sub = 0, unclaimed = 0;
  items.forEach(i => {
    sub += i.price;
    const c = i.claims || [];
    if (!c.length) unclaimed += i.price * f;
    else c.forEach(n => { per[n] = (per[n] || 0) + i.price * (splitOK(i) ? i.split[n] / 100 : 1 / c.length) * f; (names[n] = names[n] || []).push(i.name); });
  });
  if (b.splitMode === 'equal' && (b.parts || []).length) {
    Object.keys(per).forEach(k => delete per[k]); Object.keys(names).forEach(k => delete names[k]);
    b.parts.forEach(n => { per[n] = sub * f / b.parts.length; names[n] = ['equal share']; });
    unclaimed = 0;
  }
  let custom = null;
  if (b.splitMode === 'custom' && (b.parts || []).length) {
    Object.keys(per).forEach(k => delete per[k]); Object.keys(names).forEach(k => delete names[k]);
    const T = sub * f, sp = b.split || {}, g = n => sp[n] || { t: 'pct', v: 0 };
    let fixed = 0, pct = 0, hasPct = false;
    b.parts.forEach(n => { if (g(n).t === 'amt') fixed += g(n).v; else { pct += g(n).v; hasPct = true; } });
    const rest = T - fixed;
    b.parts.forEach(n => { const x = g(n); per[n] = x.t === 'amt' ? x.v : rest * x.v / 100; names[n] = [x.t === 'amt' ? 'fixed amount' : x.v + '%']; });
    const keys = Object.keys(per);
    keys.forEach(k => per[k] = Math.round(per[k] * 100) / 100);
    const ok = rest >= -0.005 && (hasPct ? Math.abs(pct - 100) < 0.005 : Math.abs(rest) < 0.005);
    if (ok) {
      const diff = Math.round((T - keys.reduce((a, k) => a + per[k], 0)) * 100) / 100;
      if (diff) { const big = keys.reduce((a, k) => per[k] > per[a] ? k : a, keys[0]); per[big] = Math.round((per[big] + diff) * 100) / 100; }
    }
    unclaimed = 0; custom = { ok, fixed, pct, rest, hasPct };
  }
  return { per, names, total: sub * f, unclaimed, custom };
}
function balances(bills, sets) {
  const bal = {}, add = (n, v) => bal[n] = (bal[n] || 0) + v;
  bills.forEach(b => {
    if (!b.payer) return;
    Object.entries(calc(b).per).forEach(([n, v]) => { if (n !== b.payer) { add(n, -v); add(b.payer, v); } });
  });
  (sets || []).forEach(s => { add(s.from, s.amt); add(s.to, -s.amt); });
  return bal;
}
function suggest(bal) {
  const d = [], c = [];
  Object.entries(bal).forEach(([n, v]) => { if (v < -0.005) d.push([n, -v]); else if (v > 0.005) c.push([n, v]); });
  d.sort((a, b) => b[1] - a[1]); c.sort((a, b) => b[1] - a[1]);
  const out = []; let i = 0, j = 0;
  while (i < d.length && j < c.length) {
    const x = Math.min(d[i][1], c[j][1]);
    out.push({ from: d[i][0], to: c[j][0], amt: Math.round(x * 100) / 100 });
    d[i][1] -= x; c[j][1] -= x;
    if (d[i][1] < .005) i++;
    if (c[j][1] < .005) j++;
  }
  return out;
}

// ---------- routing ----------
let db, FV, unsubs = [];
const sub = (ref, fn) => unsubs.push(ref.onSnapshot(fn, e => { app.innerHTML = '<div class="card"><b>Could not load.</b><p class="m">' + esc(e.message) + '</p><a href="#/">Back</a></div>'; }));
function route() {
  unsubs.forEach(u => u()); unsubs = [];
  app.onclick = app.onchange = null;
  const [, t, id] = location.hash.split('/');
  if (t === 't' && id) viewTrip(id);
  else if (t === 'b' && id) viewBill(id);
  else viewHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
const go = h => { location.hash = h; };
const on = (map) => {
  app.onclick = e => { const el = e.target.closest('[data-a]'); if (el && map[el.dataset.a]) { e.stopPropagation(); map[el.dataset.a](el, e); } };
};

// ---------- home ----------
function viewHome() {
  const h = ls.get('hist', []), gs = h.filter(x => x.t === 't'), bs = h.filter(x => x.t === 'b');
  const row = x => `<div class="row"><a class="n ex" href="#/${x.t}/${esc(x.id)}"><span class="av">${esc((x.name || '?')[0].toUpperCase())}</span>${esc(x.name)}</a><button class="x" data-a="rm" data-id="${esc(x.id)}" aria-label="Remove from list">Remove</button></div>`;
  app.innerHTML = `<div class="hd"><h1>Groups</h1><p class="m">Share costs with friends. Everyone with the link can join in, no sign-in.</p></div>
  <div class="card">${gs.map(row).join('') || '<p class="m">No groups yet. Start one for a trip, a household, or any shared costs.</p>'}<div class="bar"><button class="s" data-a="nt">Start a new group</button></div></div>
  <div class="card"><h2>Non-group expenses</h2>${bs.map(row).join('') || '<p class="m">One-off expenses outside a group show up here.</p>'}<div class="bar"><button class="s" data-a="nb">Add a non-group expense</button></div></div>
  ${h.length ? '<div class="bar"><button class="s" data-a="bk">Copy all my links</button></div><p class="m">This list lives on this phone only. Saved links still open your groups anywhere.</p>' : ''}
  <button class="fab" data-a="nt">+ New group</button>`;
  bs.forEach(x => db.collection('bills').doc(x.id).get().then(d => {
    if (d.exists && d.data().tripId) {
      ls.set('hist', ls.get('hist', []).filter(y => y.id !== x.id));
      if (['', '#', '#/'].includes(location.hash)) viewHome();
    }
  }).catch(() => {}));
  on({
    nt: () => { const n = prompt('Group name (e.g. Langkawi 2026)'); if (!n) return; const id = rid(); db.collection('trips').doc(id).set({ name: n.trim(), members: [], settlements: [], created: Date.now() }).then(() => go('/t/' + id)); },
    nb: () => newBill(null),
    rm: el => { ls.set('hist', ls.get('hist', []).filter(x => x.id !== el.dataset.id)); viewHome(); },
    bk: el => copy(ls.get('hist', []).map(x => x.name + ': ' + link(x.t, x.id)).join('\n'), el)
  });
}
function newBill(tripId) {
  const n = prompt('Expense description (e.g. Seafood dinner)'); if (!n) return;
  const mk = m => {
    const id = rid();
    db.collection('bills').doc(id).set({ name: n.trim(), tripId: tripId || null, members: tripId ? [] : m, parts: m, items: {}, svc: 0, tax: 0, payer: '', splitMode: 'items', locked: false, created: Date.now() }).then(() => go('/b/' + id));
  };
  if (tripId) db.collection('trips').doc(tripId).get().then(d => { const m = (d.data() || {}).members || []; if (!m.length) { alert('Add people to the group first.'); return; } mk(m); });
  else { const m = [...new Set((prompt('Who is in this bill? Names separated by commas') || '').split(',').map(s => s.trim()).filter(Boolean))]; if (m.length) mk(m); }
}

// ---------- trip ----------
function viewTrip(id) {
  let trip = null, bills = [], tab = 'x';
  const ref = db.collection('trips').doc(id);
  const mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const draw = () => {
    if (trip === null) { app.innerHTML = '<p class="m" style="padding:16px">Loading...</p>'; return; }
    if (trip === false) { app.innerHTML = '<div class="card"><b>Group not found.</b> <a href="#/">Back</a></div>'; return; }
    bills.forEach(b => { b.parts = b.parts || trip.members; });
    const saved = ls.get('me_' + id, ''), me = trip.members.includes(saved) ? saved : '';
    const bal = balances(bills, trip.settlements), sg = suggest(bal);
    const spent = bills.reduce((s, b) => s + calc(b).total, 0), mb = me ? (bal[me] || 0) : 0;
    const line = !me ? 'Pick your name to see your balance' : mb > 0.005 ? 'You are owed ' + rm(mb) : mb < -0.005 ? 'You owe ' + rm(-mb) : 'You are all settled up';
    const chips = cls => trip.members.map(m => `<button class="chip ${m === me ? 'on' : ''}" data-a="me" data-n="${esc(m)}">${esc(m)}</button>`).join('');
    const meCard = !me && trip.members.length ? `<div class="card"><h2>Who are you?</h2><div class="chips">${chips()}</div></div>` : '';
    let body = '';
    if (tab === 'x') {
      body = [...bills].sort((a, b) => b.created - a.created).map(b => {
        const c = calc(b), d = new Date(b.created);
        let st = '<span class="m">no payer yet</span>';
        if (me && b.payer) {
          if (b.payer === me) { const lent = Object.entries(c.per).reduce((s, [n, v]) => n === me ? s : s + v, 0); st = lent > 0.005 ? `<span class="pos">you lent<b>${rm(lent)}</b></span>` : '<span class="m">not involved</span>'; }
          else if (c.per[me]) st = `<span class="neg">you borrowed<b>${rm(c.per[me])}</b></span>`;
          else st = '<span class="m">not involved</span>';
        }
        return `<a class="row ex" href="#/b/${esc(b._id)}"><span class="dt">${mon[d.getMonth()]}<br><b>${d.getDate()}</b></span><span class="n"><b>${esc(b.name)}</b><br><span class="m">${b.payer ? esc(b.payer === me ? 'You' : b.payer) + ' paid ' + rm(c.total) : rm(c.total)}</span></span><span class="st">${st}</span></a>`;
      }).join('') || '<p class="m">No expenses yet. Tap Add expense to record the first one.</p>';
      body = `<div class="card">${body}</div>`;
    } else if (tab === 'b') {
      body = `<div class="card"><h2>Balances</h2>${trip.members.map(n => { const v = bal[n] || 0; return `<div class="row"><span class="n">${esc(n)}</span><span class="amt ${v > 0.005 ? 'pos' : v < -0.005 ? 'neg' : ''}">${v > 0.005 ? 'gets back ' + rm(v) : v < -0.005 ? 'owes ' + rm(-v) : 'settled up'}</span></div>`; }).join('') || '<p class="m">Add people in the Members tab first.</p>'}</div>
      <div class="card"><h2>Settle up</h2>${sg.map(s => `<div class="row"><span class="n">${esc(s.from)} pays ${esc(s.to)}</span><span class="amt">${rm(s.amt)}</span><button data-a="st" data-f="${esc(s.from)}" data-t="${esc(s.to)}" data-v="${s.amt}">Settle up</button></div>`).join('') || '<p class="m">Everyone is settled up.</p>'}
      ${(trip.settlements || []).length ? '<p class="m">Recorded payments</p>' + trip.settlements.map((s, i) => `<div class="row"><span class="n m">${esc(s.from)} paid ${esc(s.to)} ${rm(s.amt)}</span><button class="x" data-a="us" data-i="${i}">Undo</button></div>`).join('') : ''}</div>`;
    } else {
      body = `<div class="card"><h2>Members</h2><div class="chips">${trip.members.map(m => `<span class="chip">${esc(m)}</span>`).join('') || '<span class="m">Add everyone once; every expense reuses these names.</span>'}</div><div class="bar"><button class="s" data-a="am">Add a person</button></div></div>
      ${me || !trip.members.length ? `<div class="card"><h2>Who are you?</h2><div class="chips">${chips()}</div></div>` : ''}
      <div class="card"><h2>Group total</h2><div class="big">${rm(spent)}</div><p class="m">across ${bills.length} expense${bills.length === 1 ? '' : 's'}</p><div class="bar"><button class="s" data-a="cl">Copy group link</button></div></div>`;
    }
    const seg = (v, t) => `<button class="${tab === v ? 'on' : ''}" data-a="tab" data-v="${v}">${t}</button>`;
    app.innerHTML = `<div class="hd"><a href="#/">‹ Groups</a><h1>${esc(trip.name)}</h1><p class="m">${line}</p></div>${tab === 'x' ? meCard : ''}
    <div class="seg">${seg('x', 'Expenses')}${seg('b', 'Balances')}${seg('m', 'Members')}</div>${body}
    <button class="fab" data-a="nb">+ Add expense</button>`;
  };
  sub(ref, d => { trip = d.exists ? d.data() : false; if (trip) addHist('t', id, trip.name); draw(); });
  sub(db.collection('bills').where('tripId', '==', id), q => { bills = q.docs.map(d => ({ ...d.data(), _id: d.id })); draw(); });
  on({
    tab: el => { tab = el.dataset.v; draw(); },
    me: el => { ls.set('me_' + id, el.dataset.n); draw(); },
    nb: () => newBill(id),
    cl: el => copy(link('t', id), el),
    am: () => { const n = (prompt('Name') || '').trim(); if (n) ref.update({ members: FV.arrayUnion(n) }); },
    st: el => { if (confirm(el.dataset.f + ' paid ' + el.dataset.t + ' ' + rm(+el.dataset.v) + '?')) ref.update({ settlements: FV.arrayUnion({ from: el.dataset.f, to: el.dataset.t, amt: +el.dataset.v, t: Date.now() }) }); },
    us: el => { const s = trip.settlements[+el.dataset.i]; if (s && confirm('Undo this payment?')) ref.update({ settlements: FV.arrayRemove(s) }); }
  });
}

// ---------- bill ----------
function viewBill(id) {
  let bill = null, trip = null, tripSub = false, pick = null, newOwn = [], keep = { n: '', p: '' };
  const ref = db.collection('bills').doc(id);
  const pool = () => bill.tripId ? (trip ? trip.members : []) : (bill.members || []);
  const parts = () => bill.parts || pool();
  const cur = () => ({ ...bill, parts: parts() });
  const meKey = () => 'me_' + (bill.tripId || id);
  const draw = () => {
    if (bill === null) { app.innerHTML = '<p class="m">Loading...</p>'; return; }
    if (bill === false) { app.innerHTML = '<div class="card"><b>Bill not found.</b> <a href="#/">Back</a></div>'; return; }
    const iv = document.getElementById('in'), pv = document.getElementById('ip');
    if (iv) keep = { n: iv.value, p: pv.value };
    const P = parts(), saved = ls.get(meKey(), ''), me = P.includes(saved) ? saved : '';
    const c = calc(cur()), locked = bill.locked, eq = bill.splitMode === 'equal', cm = bill.splitMode === 'custom';
    const sp = bill.split || {}, cu = c.custom;
    const msg = !cu ? '' : cu.ok ? 'Adds up to the bill' : cu.rest < -0.005 ? 'Fixed amounts exceed the bill by ' + rm(-cu.rest) : cu.hasPct ? 'Percentages total ' + (Math.round(cu.pct * 100) / 100) + '%, need 100%' : rm(cu.rest) + ' still unassigned';
    const cust = cm ? `<div class="card"><h2>Custom split</h2><p class="m">Set a percentage or a fixed RM amount for each person. Fixed amounts come off the bill total first, and percentages share the rest and must reach 100%.</p>${P.map(n => { const x = sp[n] || { t: 'pct', v: 0 }; return `<div class="row"><span class="n">${esc(n)}</span><input type="number" inputmode="decimal" min="0" step="0.01" style="width:96px" value="${x.v || ''}" data-a="cv" data-n="${esc(n)}" aria-label="Value for ${esc(n)}" ${locked ? 'disabled' : ''}><button class="s" data-a="ct" data-n="${esc(n)}" ${locked ? 'disabled' : ''} aria-label="Switch between percent and RM">${x.t === 'amt' ? 'RM' : '%'}</button></div>`; }).join('')}<p><span class="tag">${msg}</span></p></div>` : '';
    const items = Object.entries(bill.items || {}).sort((a, b) => a[1].o - b[1].o);
    const sum = Object.entries(c.per);
    const opts = pick ? (pick.kind === 'parts' ? pool() : P) : [];
    const title = pick ? (pick.kind === 'parts' ? "Who's in this bill?" : pick.kind === 'item' ? 'Whose item is ' + esc((bill.items[pick.k] || {}).name) + '?' : 'Whose item is this?') : '';
    const panelHtml = pick ? `<div class="dd"><div class="row"><h2>${title}</h2><button class="s" data-a="pa">${opts.every(o => pick.sel.includes(o)) ? 'Clear all' : 'Select all'}</button></div>
      ${opts.map(o => `<div class="row item" tabindex="0" role="checkbox" aria-checked="${pick.sel.includes(o)}" data-a="pt" data-n="${esc(o)}"><span class="n">${esc(o)}</span>${pick.pct && pick.sel.includes(o) ? `<input type="number" inputmode="decimal" min="0" step="0.01" style="width:84px" data-a="pv" data-n="${esc(o)}" value="${pick.pct[o] ?? ''}" aria-label="Percent for ${esc(o)}"><span>%</span>` : ''}<b>${pick.sel.includes(o) ? '✓' : ''}</b></div>`).join('') || '<p class="m">No people yet. Ask the organizer to add you to the trip.</p>'}
      ${pick.kind === 'item' && pick.sel.length > 1 ? `<div class="bar"><button class="s" data-a="pm">${pick.pct ? 'Split evenly' : 'Split by %'}</button>${pick.pct ? `<span class="tag">Total ${Math.round(pick.sel.reduce((a, n) => a + (pick.pct[n] || 0), 0) * 100) / 100}%, need 100%</span>` : ''}</div>` : ''}
      <div class="bar"><button data-a="pd">Done</button><button class="s" data-a="pc">Cancel</button></div></div>` : '';
    const dd = (kind, k) => pick && pick.kind === kind && (kind !== 'item' || pick.k === k) ? panelHtml : '';
    app.innerHTML = `<div class="hd"><a href="${bill.tripId ? '#/t/' + esc(bill.tripId) : '#/'}">‹ ${bill.tripId ? 'Group' : 'Groups'}</a><h1>${esc(bill.name)} ${locked ? '<span class="tag">Locked</span>' : ''}</h1><p class="m">${rm(c.total)} total${bill.payer ? ', paid by ' + esc(bill.payer) : ''}</p></div>
    <div class="bar"><button class="s" data-a="cl">Copy link to share</button></div>
    <div class="card"><h2>Who's in this bill?</h2><div class="chips">${P.map(m => `<span class="chip">${esc(m)}</span>`).join('') || '<span class="m">Nobody yet.</span>'}</div><div class="bar"><button class="s" data-a="pp" ${locked ? 'disabled' : ''}>${P.length} of ${pool().length} people</button></div>${dd('parts')}</div>
    <div class="card"><h2>Who are you?</h2><div class="chips">${P.map(m => `<button class="chip ${m === me ? 'on' : ''}" data-a="me" data-n="${esc(m)}">${esc(m)}</button>`).join('')}</div><p class="m">Not listed? Ask the organizer to add you.</p></div>
    <div class="card"><h2>Items</h2><p class="m">${eq || cm ? 'This bill is split ' + (eq ? 'equally' : 'by custom amounts') + ', so claims are ignored.' : 'Tap an item to choose who it belongs to.'}</p>
    ${items.map(([k, i]) => { const cl = i.claims || []; return `<div class="row item ${cl.includes(me) ? 'mine' : ''}" tabindex="0" role="button" data-a="ei" data-k="${k}"><span class="n">${esc(i.name)}<br><span class="m">${esc(cl.map(n => splitOK(i) ? n + ' ' + i.split[n] + '%' : n).join(', '))}</span>${cl.length ? '' : '<span class="tag">unclaimed</span>'}</span><span class="amt">${rm(i.price)}</span>${locked ? '' : `<button class="x" data-a="di" data-k="${k}" aria-label="Delete item">✕</button>`}</div>${dd('item', k)}`; }).join('') || '<p class="m">No items yet.</p>'}
    ${locked ? '' : `<div class="f"><input id="in" placeholder="Item name" aria-label="Item name" value="${esc(keep.n)}"><input id="ip" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Price" aria-label="Price" value="${esc(keep.p)}"></div><div class="f"><button class="s" data-a="no">${newOwn.length ? newOwn.length + ' owner' + (newOwn.length > 1 ? 's' : '') : 'Whose item?'}</button><button data-a="ai">Add item</button></div>${dd('new')}`}</div>
    <div class="card"><h2>Charges and payer</h2>
    <div class="row"><span class="n">Split method</span><select data-a="sm" ${locked ? 'disabled' : ''}><option value="items" ${eq || cm ? '' : 'selected'}>By items</option><option value="equal" ${eq ? 'selected' : ''}>Equally</option><option value="custom" ${cm ? 'selected' : ''}>Custom % / RM</option></select></div>
    <div class="row"><span class="n">Service charge</span><span class="amt">${bill.svc}%</span><button class="s" data-a="sv" ${locked ? 'disabled' : ''}>Edit</button></div>
    <div class="row"><span class="n">SST / tax (on top of service)</span><span class="amt">${bill.tax}%</span><button class="s" data-a="tx" ${locked ? 'disabled' : ''}>Edit</button></div>
    <div class="row"><span class="n">Paid by</span><select data-a="py" ${locked ? 'disabled' : ''}><option value="">Choose</option>${P.map(m => `<option ${m === bill.payer ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div></div>
    ${cust}<div class="card"><h2>Who owes what</h2><div class="big">${rm(c.total)}</div><p class="m">bill total</p>
    ${c.unclaimed > 0.005 ? `<p><span class="tag">${rm(c.unclaimed)} not claimed yet</span></p>` : ''}
    ${sum.map(([n, v]) => `<div class="row"><span class="n"><b>${esc(n)}</b><br><span class="m">${esc(c.names[n].join(', '))}</span></span><span class="amt">${rm(v)}</span></div>`).join('') || '<p class="m">Nobody has claimed anything yet.</p>'}
    <div class="bar"><button data-a="cs">Copy summary for WhatsApp</button></div></div>
    <div class="bar"><button class="s" data-a="lk">${locked ? 'Unlock bill' : 'Lock bill'}</button><button class="s" data-a="db">Delete bill</button></div>`;
  };
  sub(ref, d => {
    bill = d.exists ? d.data() : false;
    if (bill) {
      if (bill.tripId) ls.set('hist', ls.get('hist', []).filter(x => x.id !== id)); else addHist('b', id, bill.name);
      if (bill.tripId && !tripSub) { tripSub = true; sub(db.collection('trips').doc(bill.tripId), t => { trip = t.exists ? t.data() : null; if (trip) addHist('t', bill.tripId, trip.name); draw(); }); }
    }
    draw();
  });
  const upd = o => { if (!bill.locked || 'locked' in o) ref.update(o); };
  const num = (q, v) => { const x = parseFloat(prompt(q, v)); return isNaN(x) || x < 0 ? null : x; };
  on({
    cl: el => copy(link('b', id), el),
    me: el => { ls.set(meKey(), el.dataset.n); draw(); },
    pp: () => { pick = { kind: 'parts', sel: [...parts()] }; draw(); },
    ei: el => { if (bill.locked) return; const k = el.dataset.k; pick = { kind: 'item', k, sel: [...(bill.items[k].claims || [])], pct: splitOK(bill.items[k]) ? { ...bill.items[k].split } : null }; draw(); },
    no: () => { pick = { kind: 'new', sel: [...newOwn] }; draw(); },
    pm: () => {
      if (pick.pct) pick.pct = null;
      else { const e = Math.floor(10000 / pick.sel.length) / 100; pick.pct = {}; pick.sel.forEach(n => pick.pct[n] = e); pick.pct[pick.sel[0]] = Math.round((e + 100 - e * pick.sel.length) * 100) / 100; }
      draw();
    },
    pt: el => { pick.pct = null; const n = el.dataset.n, i = pick.sel.indexOf(n); if (i < 0) pick.sel.push(n); else pick.sel.splice(i, 1); draw(); },
    pa: () => { pick.pct = null; const o = pick.kind === 'parts' ? pool() : parts(); pick.sel = o.every(x => pick.sel.includes(x)) ? [] : [...o]; draw(); },
    pc: () => { pick = null; draw(); },
    pd: () => {
      const sel = pick.sel;
      if (pick.kind === 'parts') {
        if (!sel.length) { alert('Pick at least one person.'); return; }
        const o = { parts: sel }; let lost = 0;
        if (bill.payer && !sel.includes(bill.payer)) o.payer = '';
        Object.entries(bill.items || {}).forEach(([k, i]) => { const all = i.claims || [], cl = all.filter(n => sel.includes(n)); if (cl.length !== all.length) { o['items.' + k + '.claims'] = cl; lost++; } });
        if (lost && !confirm('Removing people will clear their claims on ' + lost + ' item(s). Continue?')) return;
        upd(o);
      } else if (pick.kind === 'item') {
        let spl = FV.delete();
        if (pick.pct && sel.length > 1) {
          if (Math.abs(sel.reduce((a, n) => a + (pick.pct[n] || 0), 0) - 100) > 0.01) { alert('Percentages must add up to 100%.'); return; }
          spl = {}; sel.forEach(n => spl[n] = pick.pct[n] || 0);
        }
        upd({ ['items.' + pick.k + '.claims']: sel, ['items.' + pick.k + '.split']: spl });
      }
      else newOwn = sel;
      pick = null; draw();
    },
    cl2: el => {
      const me = ls.get(meKey(), ''); if (bill.locked) return;
      if (!parts().includes(me)) { alert('Pick your name first.'); return; }
      const k = el.dataset.k, mine = (bill.items[k].claims || []).includes(me);
      upd({ ['items.' + k + '.claims']: mine ? FV.arrayRemove(me) : FV.arrayUnion(me) });
    },
    ai: () => {
      const ie = document.getElementById('in'), pe = document.getElementById('ip');
      const n = ie.value.trim(), p = parseFloat(pe.value);
      if (!n || isNaN(p) || p < 0) { alert('Enter an item name and a price.'); return; }
      const claims = [...newOwn];
      ie.value = ''; pe.value = ''; keep = { n: '', p: '' }; newOwn = [];
      upd({ ['items.' + rid()]: { name: n, price: p, claims, o: Date.now() } });
    },
    di: el => { if (confirm('Delete this item?')) upd({ ['items.' + el.dataset.k]: FV.delete() }); },
    sv: () => { const v = num('Service charge %', bill.svc); if (v !== null) upd({ svc: v }); },
    tx: () => { const v = num('SST / tax %', bill.tax); if (v !== null) upd({ tax: v }); },
    ct: el => { const n = el.dataset.n, sp = { ...(bill.split || {}) }, x = sp[n] || { t: 'pct', v: 0 }; sp[n] = { t: x.t === 'amt' ? 'pct' : 'amt', v: x.v }; upd({ split: sp }); },
    lk: () => { if (!bill.locked && bill.splitMode === 'custom' && !calc(cur()).custom.ok) { alert('Make the custom split add up to the bill before locking.'); return; } upd({ locked: !bill.locked }); },
    db: () => { if (confirm('Delete this whole bill for everyone?')) ref.delete().then(() => { ls.set('hist', ls.get('hist', []).filter(x => x.id !== id)); go(bill.tripId ? '/t/' + bill.tripId : '/'); }); },
    cs: el => {
      const c = calc(cur());
      copy(bill.name + '\nTotal ' + rm(c.total) + (bill.payer ? ', paid by ' + bill.payer : '') + '\n' + Object.entries(c.per).map(([n, v]) => n + ': ' + rm(v) + ' (' + c.names[n].join(', ') + ')').join('\n') + '\n' + link('b', id), el);
    }
  });
  app.onchange = e => { const a = e.target.dataset.a;
    if (a === 'pv' && pick) { pick.pct = pick.pct || {}; pick.pct[e.target.dataset.n] = Math.max(0, parseFloat(e.target.value) || 0); draw(); return; } if (a === 'py') upd({ payer: e.target.value }); if (a === 'sm') upd({ splitMode: e.target.value });
    if (a === 'cv') { const n = e.target.dataset.n, sp = { ...(bill.split || {}) }, x = sp[n] || { t: 'pct', v: 0 }; sp[n] = { t: x.t, v: Math.max(0, parseFloat(e.target.value) || 0) }; upd({ split: sp }); } };
  app.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('item')) { e.preventDefault(); e.target.click(); } };
}

// ---------- start ----------
if (CFG.projectId === 'PASTE') {
  app.innerHTML = '<div class="card"><h2>One more step</h2><p>Open <b>index.html</b>, find <b>CFG</b> near the top of the script, and paste in your Firebase web app config.</p></div>';
} else {
  firebase.initializeApp(CFG);
  db = firebase.firestore();
  FV = firebase.firestore.FieldValue;
  route();
}
</script>
</body>
</html>
