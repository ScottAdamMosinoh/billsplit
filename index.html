<script>

const CFG = { apiKey: "AIzaSyAFVezfimw-kP3_tq-b3DuJ1jP0agB20NM", authDomain: "bill-split-b622d.firebaseapp.com", projectId: "bill-split-b622d", appId: "1:408745893445:web:832f4188ae4b62eb154d2c" };

const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm = n => 'RM ' + (Math.round(n * 100) / 100).toFixed(2);

const ls = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

function addHist(t, id, name) {

  h.unshift({ t, id, name });
  ls.set('hist', h.slice(0, 200));
}

const CURS = ['MYR', 'SGD', 'USD', 'EUR', 'GBP', 'JPY', 'THB', 'IDR', 'AUD', 'CNY', 'KRW', 'INR'];
const fmt = (n, c) => (c || 'MYR') + ' ' + (Math.round(n * 100) / 100).toFixed(2);
// ---------- maths ----------
function splitOK(i) {
  const c = i.claims || [], x = i.split;
  return !!x && c.length > 1 && Object.keys(x).length === c.length && c.every(n => n in x) && Math.abs(c.reduce((a, n) => a + x[n], 0) - 100) < 0.01;
}
function calc(b) {
  if (b.mode === 'whole') {
    const T = +b.amount || 0, per = {}, names = {};
    if (b.how === 'pct') Object.entries(b.pct || {}).forEach(([n, v]) => { if (v) { per[n] = T * v / 100; names[n] = [v + '%']; } });
    else if (b.how === 'amt') Object.entries(b.amt || {}).forEach(([n, v]) => { if (v) { per[n] = +v; names[n] = ['fixed amount']; } });
    else { const E = b.even || []; E.forEach(n => { per[n] = T / E.length; names[n] = ['equal share']; }); }
    return { per, names, total: T, unclaimed: 0, custom: null };
  }
  const items = Object.values(b.items || {});
  const f = (1 + (b.svc || 0) / 100) * (1 + (b.tax || 0) / 100);
  const per = {}, names = {};
  let sub = 0, unclaimed = 0;
  items.forEach(i => {
    sub += i.price;
    const c = i.claims || [];
    if (!c.length) unclaimed += i.price * f;
    else c.forEach(n => { per[n] = (per[n] || 0) + i.price * (splitOK(i) ? i.split[n] / 100 : 1 / c.length) * f; (names[n] = names[n] || []).push(i.name); });
  });
  if (b.splitMode === 'equal' && (b.parts || []).length) {
    Object.keys(per).forEach(k => delete per[k]); Object.keys(names).forEach(k => delete names[k]);
    b.parts.forEach(n => { per[n] = sub * f / b.parts.length; names[n] = ['equal share']; });
    unclaimed = 0;
  }
  let custom = null;
  if (b.splitMode === 'custom' && (b.parts || []).length) {
    Object.keys(per).forEach(k => delete per[k]); Object.keys(names).forEach(k => delete names[k]);
    const T = sub * f, sp = b.split || {}, g = n => sp[n] || { t: 'pct', v: 0 };
    let fixed = 0, pct = 0, hasPct = false;
    b.parts.forEach(n => { if (g(n).t === 'amt') fixed += g(n).v; else { pct += g(n).v; hasPct = true; } });
    const rest = T - fixed;
    b.parts.forEach(n => { const x = g(n); per[n] = x.t === 'amt' ? x.v : rest * x.v / 100; names[n] = [x.t === 'amt' ? 'fixed amount' : x.v + '%']; });
    const keys = Object.keys(per);
    keys.forEach(k => per[k] = Math.round(per[k] * 100) / 100);
    const ok = rest >= -0.005 && (hasPct ? Math.abs(pct - 100) < 0.005 : Math.abs(rest) < 0.005);
    if (ok) {
      const diff = Math.round((T - keys.reduce((a, k) => a + per[k], 0)) * 100) / 100;
      if (diff) { const big = keys.reduce((a, k) => per[k] > per[a] ? k : a, keys[0]); per[big] = Math.round((per[big] + diff) * 100) / 100; }
    }
    unclaimed = 0; custom = { ok, fixed, pct, rest, hasPct };
  }
  return { per, names, total: sub * f, unclaimed, custom };
}
function balances(bills, sets, cur) {
  const bal = {}, add = (n, v) => bal[n] = (bal[n] || 0) + v;
  bills.forEach(b => {
    if (!b.payer || (b.currency || 'MYR') !== cur) return;
    Object.entries(calc(b).per).forEach(([n, v]) => { if (n !== b.payer) { add(n, -v); add(b.payer, v); } });
  });
  (sets || []).filter(s => (s.cur || 'MYR') === cur).forEach(s => { add(s.from, s.amt); add(s.to, -s.amt); });
  return bal;
}
function suggest(bal) {
  const d = [], c = [];
  Object.entries(bal).forEach(([n, v]) => { if (v < -0.005) d.push([n, -v]); else if (v > 0.005) c.push([n, v]); });
  d.sort((a, b) => b[1] - a[1]); c.sort((a, b) => b[1] - a[1]);
  const out = []; let i = 0, j = 0;
  while (i < d.length && j < c.length) {
    const x = Math.min(d[i][1], c[j][1]);
    out.push({ from: d[i][0], to: c[j][0], amt: Math.round(x * 100) / 100 });
    d[i][1] -= x; c[j][1] -= x;
    if (d[i][1] < .005) i++;
    if (c[j][1] < .005) j++;
  }
  return out;
}

// ---------- conversion rates ----------
const TBL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>';
function fxStats(bills, convs) {
  const out = {};
  const add = (who, rc, ra, pc, pa) => {
    if (!who || !(ra > 0) || !(pa > 0) || rc === pc) return null;
    const [c1, c2] = [rc, pc].sort(), k = c1 + '|' + c2, o = (out[who] = out[who] || {});
    const s = (o[k] = o[k] || { c1, c2, t1: 0, t2: 0, e: 0, c: 0, r1: 0, r2: 0 });
    s.t1 += rc === c1 ? ra : pa; s.t2 += rc === c1 ? pa : ra;
    if (rc === c1) s.r1++; else s.r2++;
    return s;
  };
  bills.forEach(b => { if (b.fx) { const s = add(b.payer, b.currency || 'MYR', calc(b).total, b.fx.cur, b.fx.amt); if (s) s.e++; } });
  (convs || []).forEach(v => { const s = add(v.who, v.buyCur, v.buyAmt, v.payCur, v.payAmt); if (s) s.c++; });
  return out;
}

// ---------- receipt scanning ----------
let tessP = null;
const loadTess = () => tessP || (tessP = new Promise((res, rej) => {
  const t = document.createElement('script');
  t.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  t.onload = () => res(window.Tesseract);
  t.onerror = () => { tessP = null; rej(new Error('Could not load the scanner. Check your connection.')); };
  document.head.appendChild(t);
}));
async function prepPhoto(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { bmp = await createImageBitmap(file); }
  const sc = Math.min(1, 1800 / Math.max(bmp.width, bmp.height)), cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
  const x = cv.getContext('2d'); x.filter = 'grayscale(1) contrast(1.4)'; x.drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv;
}
const SKIP = /total|tax|sst|gst|service|svc|change|cash|round|paid|payment|tender|discount|balance|visa|master|card|invoice|receipt|table|cashier|date|time|tel|phone|thank|amount|qty|item/i;
function parseReceipt(text) {
  const out = [];
  text.split('\n').forEach(line => {
    const t = line.replace(/\s+/g, ' ').trim();
    const m = t.match(/^(.*?)\s*(?:RM|\$)?\s*(\d{1,5}[.,]\d{2})\s*[A-Za-z]{0,2}$/);
    if (!m) return;
    const name = m[1].replace(/[|_~=*]+/g, ' ').replace(/\s*(RM|\$)$/i, '').replace(/[\s.:-]+$/, '').trim();
    if (name.length < 2 || !/[A-Za-z]/.test(name) || SKIP.test(name)) return;
    out.push({ n: name, p: m[2].replace(',', '.') });
  });
  return out;
}

// ---------- routing ----------
let db, FV, unsubs = [], scanHook = null;
const sub = (ref, fn) => unsubs.push(ref.onSnapshot(fn, e => { app.innerHTML = '<div class="card"><b>Could not load.</b><p class="m">' + esc(e.message) + '</p><a href="#/">Back</a></div>'; }));
function route() {
  unsubs.forEach(u => u()); unsubs = []; scanHook = null;

// ---------- home ----------
function viewHome() {
  const h = ls.get('hist', []), gs = h.filter(x => x.t === 't'), bs = h.filter(x => x.t === 'b');
  const row = x => `<div class="row"><a class="n ex" href="#/${x.t}/${esc(x.id)}"><span class="av">${esc((x.name || '?')[0].toUpperCase())}</span>${esc(x.name)}</a><button class="x" data-a="rm" data-id="${esc(x.id)}" aria-label="Remove from list">Remove</button></div>`;

  <div class="card"><h2>Non-group expenses</h2>${bs.map(row).join('') || '<p class="m">One-off expenses outside a group show up here.</p>'}<div class="bar"><button class="s" data-a="nb">Add a non-group expense</button></div></div>
  ${h.length ? '<div class="bar"><button class="s" data-a="bk">Copy all my links</button></div><p class="m">This list lives on this phone only. Saved links still open your groups anywhere.</p>' : ''}
  <button class="fab" data-a="nt">+ New group</button>`;
  bs.forEach(x => db.collection('bills').doc(x.id).get().then(d => {

    nb: () => go('/n/-'),

function newBill(tripId) {
  const n = prompt('Expense description (e.g. Seafood dinner)'); if (!n) return;

  };

}

// ---------- trip ----------
function viewTrip(id) {
  let trip = null, bills = [], tab = 'x', cmp = null, cv = { ba: '', bc: 'JPY', pa: '', pc: 'MYR' };
  const ref = db.collection('trips').doc(id);
  const mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    if (trip === null) { app.innerHTML = '<p class="m" style="padding:16px">Loading...</p>'; return; }
    if (trip === false) { app.innerHTML = '<div class="card"><b>Group not found.</b> <a href="#/">Back</a></div>'; return; }

    })();

    const meCard = !me && trip.members.length ? `<div class="card"><h2>Who are you?</h2><div class="chips">${chips()}</div></div>` : '';
    let body = '';
    if (tab === 'x') {

        if (me && b.payer) {
          if (b.payer === me) { const lent = Object.entries(c.per).reduce((s, [n, v]) => n === me ? s : s + v, 0); st = lent > 0.005 ? `<span class="pos">you lent<b>${fmt(lent, cu)}</b></span>` : '<span class="m">not involved</span>'; }

      }).join('') || '<p class="m">No expenses yet. Tap Add expense to record the first one.</p>';
      body = `<div class="card">${body}</div>`;
    } else if (tab === 'b') {
      body = bals.map(([c, bal]) => `<div class="card"><h2>Balances (${c})</h2>${trip.members.map(n => { const v = bal[n] || 0; return `<div class="row"><span class="n">${esc(n)}</span><span class="amt ${v > 0.005 ? 'pos' : v < -0.005 ? 'neg' : ''}">${v > 0.005 ? 'gets back ' + fmt(v, c) : v < -0.005 ? 'owes ' + fmt(-v, c) : 'settled up'}</span></div>`; }).join('') || '<p class="m">Add people in the Members tab first.</p>'}</div>
      <div class="card"><h2>Settle up (${c})</h2>${suggest(bal).map(s => `<div class="row"><span class="n">${esc(s.from)} pays ${esc(s.to)}</span><span class="amt">${fmt(s.amt, c)}</span><button data-a="st" data-f="${esc(s.from)}" data-t="${esc(s.to)}" data-v="${s.amt}" data-c="${c}">Settle up</button></div>`).join('') || '<p class="m">Everyone is settled up.</p>'}</div>`).join('')
      + (sets.length ? '<div class="card"><h2>Recorded payments</h2>' + sets.map((s, i) => `<div class="row"><span class="n m">${esc(s.from)} paid ${esc(s.to)} ${fmt(s.amt, s.cur)}</span><button class="x" data-a="us" data-i="${i}">Undo</button></div>`).join('') + '</div>' : '');
    } else {
      let fxUI = '';
      if (me) {
        const st = fxStats(bills, trip.conversions || []), mine = st[me] || {}, inv = ls.get('inv_' + id, {}), keys = Object.keys(mine).sort();
        const dir = (x, k) => inv[k] ? { f: x.c2, t: x.c1, ft: x.t2, tt: x.t1 } : { f: x.c1, t: x.c2, ft: x.t1, tt: x.t2 };
        const opts = v => CURS.map(c => `<option ${c === v ? 'selected' : ''}>${c}</option>`).join('');
        const table = k => {
          const rows = Object.entries(st).filter(([, m]) => m[k]).map(([n, m]) => ({ n, s: m[k] }));
          const rc1 = rows.reduce((a, r) => a + r.s.r1, 0) >= rows.reduce((a, r) => a + r.s.r2, 0), eff = x => rc1 ? x.t1 / x.t2 : x.t2 / x.t1;
          rows.sort((a, b) => eff(b.s) - eff(a.s));
          const s0 = rows[0].s;
          return `<div class="dd"><table class="tb"><tr><th>Name</th><th>Rate</th><th>Converted</th><th>Sources</th></tr>${rows.map((r, i) => { const x = dir(r.s, k); return `<tr class="${i === 0 && rows.length > 1 ? 'pos' : ''}"><td>${esc(r.n)}${i === 0 && rows.length > 1 ? ' (best)' : ''}</td><td>${(x.tt / x.ft).toPrecision(6)}</td><td>${fmt(x.ft, x.f)}</td><td>${r.s.e + r.s.c}</td></tr>`; }).join('')}</table><p class="m">Best means the most ${rc1 ? s0.c1 : s0.c2} received per ${rc1 ? s0.c2 : s0.c1} paid.</p></div>`;
        };
        const mc = (trip.conversions || []).filter(c => c.who === me);
        fxUI = `<div class="card"><h2>Weighted average conversion rate</h2>${keys.length ? keys.map(k => { const x = dir(mine[k], k), s = mine[k]; return `<div class="row"><span class="n"><b>${x.f} to ${x.t} ${(x.tt / x.ft).toPrecision(6)}</b><br><span class="m">${fmt(x.ft, x.f)} from ${s.e} expense${s.e === 1 ? '' : 's'}${s.c ? ', ' + s.c + ' cash' : ''}</span></span><button class="s rnd" data-a="inv" data-k="${k}" aria-label="Invert currency pair">⇄</button><button class="s rnd" data-a="cmp" data-k="${k}" aria-label="Compare with the group">${TBL}</button></div>${cmp === k ? table(k) : ''}`; }).join('') : '<p class="m">No pairs yet. Add an actual amount to an expense you paid, or log a cash conversion below.</p>'}</div>
        <div class="card"><h2>Cash conversions</h2><p class="m">Cash you exchanged. It counts towards your rate above.</p>
        <div class="f"><input type="number" inputmode="decimal" step="0.01" min="0" data-f="ba" placeholder="Amount bought" aria-label="Amount bought" value="${esc(cv.ba)}"><select data-f="bc" aria-label="Currency bought">${opts(cv.bc)}</select></div>
        <div class="f"><input type="number" inputmode="decimal" step="0.01" min="0" data-f="pa" placeholder="Amount paid" aria-label="Amount paid" value="${esc(cv.pa)}"><select data-f="pc" aria-label="Currency paid with">${opts(cv.pc)}</select></div>
        <div class="bar"><button data-a="ca">Add conversion</button></div>
        ${mc.map(c => `<div class="row"><span class="n m">Bought ${fmt(c.buyAmt, c.buyCur)} for ${fmt(c.payAmt, c.payCur)}</span><button class="x" data-a="cd" data-id="${esc(c.id)}">Delete</button></div>`).join('')}</div>`;
      }
      const spent = curs.map(c => fmt(bills.filter(b => (b.currency || 'MYR') === c).reduce((s, b) => s + calc(b).total, 0), c)).join(', ');
      body = `<div class="card"><h2>Members</h2><div class="chips">${trip.members.map(m => `<span class="chip">${esc(m)}</span>`).join('') || '<span class="m">Add everyone once; every expense reuses these names.</span>'}</div><div class="bar"><button class="s" data-a="am">Add a person</button></div></div>
      ${trip.members.length ? `<div class="card"><h2>Who are you?</h2><div class="chips">${chips()}</div></div>` : ''}
      ${fxUI}<div class="card"><h2>Group total</h2><div class="big">${spent}</div><p class="m">across ${bills.length} expense${bills.length === 1 ? '' : 's'}</p><div class="bar"><button class="s" data-a="cl">Copy group link</button></div></div>`;
    }
    const seg = (v, t) => `<button class="${tab === v ? 'on' : ''}" data-a="tab" data-v="${v}">${t}</button>`;
    app.innerHTML = `<div class="hd"><a href="#/">‹ Groups</a><h1>${esc(trip.name)}</h1><p class="m">${line}</p></div>${tab === 'x' ? meCard : ''}
    <div class="seg">${seg('x', 'Expenses')}${seg('b', 'Balances')}${seg('m', 'Members')}</div>${body}
    <button class="fab" data-a="nb">+ Add expense</button>`;
  };
  sub(ref, d => { trip = d.exists ? d.data() : false; if (trip) addHist('t', id, trip.name); draw(); });
  sub(db.collection('bills').where('tripId', '==', id), q => { bills = q.docs.map(d => ({ ...d.data(), _id: d.id })); draw(); });
  on({
    tab: el => { tab = el.dataset.v; draw(); },
    me: el => { ls.set('me_' + id, el.dataset.n); draw(); },
    inv: el => { const f = ls.get('inv_' + id, {}); f[el.dataset.k] = !f[el.dataset.k]; ls.set('inv_' + id, f); draw(); },
    cmp: el => { cmp = cmp === el.dataset.k ? null : el.dataset.k; draw(); },
    ca: () => {
      const me = ls.get('me_' + id, ''), ba = parseFloat(cv.ba), pa = parseFloat(cv.pa);
      if (!me) return alert('Pick your name first.');
      if (!(ba > 0) || !(pa > 0)) return alert('Enter both amounts.');
      if (cv.bc === cv.pc) return alert('Choose two different currencies.');
      ref.update({ conversions: FV.arrayUnion({ id: rid(), who: me, buyCur: cv.bc, buyAmt: ba, payCur: cv.pc, payAmt: pa, t: Date.now() }) });
      cv.ba = ''; cv.pa = ''; draw();
    },
    cd: el => { const c = (trip.conversions || []).find(x => x.id === el.dataset.id); if (c) ref.update({ conversions: FV.arrayRemove(c) }); },
    nb: () => go('/n/' + id),
    cl: el => copy(link('t', id), el),
    am: () => { const n = (prompt('Name') || '').trim(); if (n) ref.update({ members: FV.arrayUnion(n) }); },
    st: el => { ref.update({ settlements: FV.arrayUnion({ from: el.dataset.f, to: el.dataset.t, amt: +el.dataset.v, cur: el.dataset.c, t: Date.now() }) }); },
    us: el => { const s = (trip.settlements || [])[+el.dataset.i]; if (s && confirm('Undo this payment?')) ref.update({ settlements: FV.arrayRemove(s) }); }
  });
  app.oninput = e => { const f = e.target.dataset.f; if (f) cv[f] = e.target.value; };
  app.onchange = e => { const f = e.target.dataset.f; if (f && e.target.tagName === 'SELECT') cv[f] = e.target.value; };
}

// ---------- expense (add / edit) ----------
const HEAD = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>';
const r2 = x => Math.round(x * 100) / 100;
const sumOf = (o, M) => M.reduce((a, m) => a + (+o[m] || 0), 0);
async function viewExpense(id, tripId) {
  let trip = null, d = null, created = Date.now(), ui = { menu: false, who: null }, scanning = '';
  const members = () => tripId ? (trip ? trip.members : []) : (d.members || []);
  const back = () => go(tripId ? '/t/' + tripId : '/');
  const blank = () => ({ name: '', mode: 'whole', cur: 'MYR', amount: '', payer: '', how: 'even', even: [...members()], pct: {}, amt: {}, svc: '', tax: '', fxAmt: '', fxCur: ls.get('fxcur', 'MYR'), items: [{ n: '', p: '', c: [] }] });
  try {
    if (id) {
      const s = await db.collection('bills').doc(id).get();
      if (!s.exists) { app.innerHTML = '<div class="card"><b>Expense not found.</b> <a href="#/">Back</a></div>'; return; }
      const b = s.data(); tripId = b.tripId || null; created = b.created || created;
      if (tripId) trip = (await db.collection('trips').doc(tripId).get()).data();
      d = { name: b.name, mode: b.mode || 'items', cur: b.currency || 'MYR', amount: b.amount ?? '', payer: b.payer || '', how: b.how || 'even', even: b.even || [...(tripId ? trip.members : b.members || [])], pct: b.pct || {}, amt: b.amt || {}, svc: b.svc || '', tax: b.tax || '', fxAmt: b.fx ? b.fx.amt : '', fxCur: b.fx ? b.fx.cur : ls.get('fxcur', 'MYR'), members: b.members || [],
        items: Object.values(b.items || {}).sort((x, y) => x.o - y.o).map(i => ({ n: i.name, p: i.price, c: [...(i.claims || [])] })) };
      if (!d.items.length) d.items = [{ n: '', p: '', c: [] }];
      if (tripId) addHist('t', tripId, trip.name); else addHist('b', id, b.name);
    } else {
      if (tripId) { const t = await db.collection('trips').doc(tripId).get(); if (!t.exists) { app.innerHTML = '<div class="card"><b>Group not found.</b> <a href="#/">Back</a></div>'; return; } trip = t.data(); if (!trip.members.length) { alert('Add people to the group first.'); return back(); } d = blank(); }
      else { const m = [...new Set((prompt('Who is in this expense? Names separated by commas') || '').split(',').map(x => x.trim()).filter(Boolean))]; if (!m.length) return back(); d = { members: m }; d = { ...blank(), members: m }; }
    }
  } catch (e) { app.innerHTML = '<div class="card"><b>Could not load.</b><p class="m">' + esc(e.message) + '</p><a href="#/">Back</a></div>'; return; }
  const hint = () => {
    const el = document.getElementById('hint'), tt = document.getElementById('tot');
    if (el) {
      const M = members();
      if (d.how === 'pct') { const s = sumOf(d.pct, M); el.textContent = 'Total ' + r2(s) + '% (' + (s <= 100 ? r2(100 - s) + '% left' : r2(s - 100) + '% over') + ')'; }
      else { const T = parseFloat(d.amount) || 0, s = sumOf(d.amt, M); el.textContent = 'Total ' + fmt(s, d.cur) + ' of ' + fmt(T, d.cur) + ' (' + (s <= T ? fmt(T - s, d.cur) + ' left' : fmt(s - T, d.cur) + ' over') + ')'; }
    }
    if (tt) { const f = (1 + (parseFloat(d.svc) || 0) / 100) * (1 + (parseFloat(d.tax) || 0) / 100); tt.textContent = 'Total with fees ' + fmt(d.items.reduce((a, r) => a + (parseFloat(r.p) || 0), 0) * f, d.cur); }
  };
  const ticks = (M, sel, act) => M.map(m => `<div class="row item" tabindex="0" role="checkbox" aria-checked="${sel.includes(m)}" data-a="${act}" data-n="${esc(m)}"><span class="n">${esc(m)}</span><b>${sel.includes(m) ? '✓' : ''}</b></div>`).join('');
  const draw = () => {
    const M = members(), w = d.mode === 'whole';
    const tog = (m, t) => `<button class="${d.mode === m ? 'on' : ''}" data-a="mode" data-v="${m}">${t}</button>`;
    const top = `<div class="row"><div class="seg" style="flex:1;margin:0">${tog('whole', 'Entire bill')}${tog('items', 'By item')}</div><select data-f="cur" aria-label="Currency">${CURS.map(c => `<option ${c === d.cur ? 'selected' : ''}>${c}</option>`).join('')}</select></div>`;
    const head = `<div class="card"><input class="w" data-f="name" placeholder="Description" aria-label="Description" value="${esc(d.name)}">
      ${w ? `<input class="w" type="number" inputmode="decimal" step="0.01" min="0" data-f="amount" placeholder="Bill amount (${d.cur})" aria-label="Bill amount" value="${esc(d.amount)}">` : ''}
      <div class="row"><span class="n">Paid by</span><select data-f="payer"><option value="">Choose</option>${M.map(m => `<option ${m === d.payer ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>
      ${w ? `<div class="row"><span class="n">Split</span><button class="s" data-a="menu">${{ even: 'Evenly (' + d.even.length + ')', pct: 'By percentages', amt: 'Unequally' }[d.how]} ▸</button></div>` : ''}</div>`;
    let main;
    if (w) {
      const tab = (v, t) => `<button class="${d.how === v ? 'on' : ''}" data-a="how" data-v="${v}">${t}</button>`;
      const body = d.how === 'even'
        ? `<div class="row"><b>Select people</b><button class="s" data-a="all">${M.every(m => d.even.includes(m)) ? 'Unselect all' : 'Select all'}</button></div>` + ticks(M, d.even, 'ev')
        : M.map(m => `<div class="row"><span class="n">${esc(m)}</span><input type="number" inputmode="decimal" step="0.01" min="0" style="width:96px" data-f="${d.how}" data-n="${esc(m)}" aria-label="${esc(m)}" value="${d[d.how][m] ?? ''}"><span>${d.how === 'pct' ? '%' : d.cur}</span></div>`).join('') + '<p class="m" id="hint"></p>';
      main = ui.menu ? `<div class="dd"><div class="seg">${tab('even', 'Evenly')}${tab('pct', 'Percentages')}${tab('amt', 'Unequally')}</div>${body}<div class="bar"><button data-a="menu">Done</button></div></div>` : '';
    } else {
      main = `<div class="card"><h2>Fees on the whole bill</h2><div class="f"><input type="number" inputmode="decimal" step="0.01" min="0" data-f="svc" placeholder="Service charge %" aria-label="Service charge percent" value="${esc(d.svc)}"><input type="number" inputmode="decimal" step="0.01" min="0" data-f="tax" placeholder="SST / tax %" aria-label="Tax percent" value="${esc(d.tax)}"></div>
      <h2 style="margin-top:14px">Items</h2>${d.items.map((it, i) => `<div class="f"><input data-f="in" data-i="${i}" placeholder="Item" aria-label="Item name" value="${esc(it.n)}"><input type="number" inputmode="decimal" step="0.01" min="0" style="width:84px" data-f="ip" data-i="${i}" placeholder="Cost" aria-label="Cost" value="${esc(it.p)}"><button class="s" data-a="who" data-i="${i}" aria-label="Who bought this">${HEAD}${it.c.length ? ' ' + it.c.length : ''}</button><button class="x" data-a="rmv" data-i="${i}" aria-label="Remove row">✕</button></div>
      ${ui.who === i ? `<div class="dd"><div class="row"><b>Who bought this?</b><button class="s" data-a="wa">${M.every(m => it.c.includes(m)) ? 'Unselect all' : 'Select all'}</button></div>${ticks(M, it.c, 'wt')}<div class="bar"><button data-a="wd">Done</button></div></div>` : ''}`).join('')}
      <div class="bar"><button class="s" data-a="addrow">+ Add row</button><button class="s" data-a="cam">Scan receipt</button><button class="s" data-a="gal">From gallery</button></div><p class="m" id="scm">${esc(scanning)}</p><p class="m" id="tot"></p></div>`;
    }
    const fxCard = `<div class="card"><h2>Actual amount charged (optional)</h2><p class="m">What your card or bank really charged, in another currency. It only feeds your conversion rate on the Members page and never changes the split.</p><div class="f"><input type="number" inputmode="decimal" step="0.01" min="0" data-f="fxAmt" placeholder="Amount" aria-label="Actual amount charged" value="${esc(d.fxAmt)}"><select data-f="fxCur" aria-label="Currency charged">${CURS.map(c => `<option ${c === d.fxCur ? 'selected' : ''}>${c}</option>`).join('')}</select></div></div>`;
    app.innerHTML = `<div class="hd"><a href="${tripId ? '#/t/' + esc(tripId) : '#/'}">‹ ${tripId ? 'Group' : 'Groups'}</a><h1>${id ? 'Edit expense' : 'Add expense'}</h1></div>${top}${head}${main}${fxCard}
    <div class="bar"><button data-a="save">Save expense</button>${id ? '<button class="s" data-a="del">Delete</button>' : ''}</div>`;
    hint();
  };
  const save = async () => {
    const name = d.name.trim(), M = members();
    if (!name) return alert('Enter a description.');
    if (!d.payer) return alert('Choose who paid.');
    const o = { name, tripId: tripId || null, currency: d.cur, mode: d.mode, payer: d.payer, created, items: {}, svc: 0, tax: 0 };
    if (!tripId) o.members = M;
    if (d.mode === 'whole') {
      const T = parseFloat(d.amount);
      if (!(T > 0)) return alert('Enter the bill amount.');
      if (d.how === 'even' && !d.even.length) return alert('Select at least one person.');
      if (d.how === 'pct') { const s = sumOf(d.pct, M); if (Math.abs(s - 100) > 0.01) return alert(s < 100 ? r2(100 - s) + '% left to reach 100%.' : r2(s - 100) + '% over 100%.'); }
      if (d.how === 'amt') { const s = sumOf(d.amt, M); if (Math.abs(s - T) > 0.01) return alert(s < T ? fmt(T - s, d.cur) + ' left to reach the full bill amount.' : fmt(s - T, d.cur) + ' over the bill amount.'); }
      Object.assign(o, { amount: T, how: d.how, even: d.even, pct: d.pct, amt: d.amt });
    } else {
      const rows = d.items.filter(r => r.n.trim() && parseFloat(r.p) >= 0);
      if (!rows.length) return alert('Add at least one item with a name and cost.');
      rows.forEach((r, i) => { o.items[rid()] = { name: r.n.trim(), price: parseFloat(r.p), claims: r.c, o: i }; });
      o.svc = parseFloat(d.svc) || 0; o.tax = parseFloat(d.tax) || 0;
    }
    if (String(d.fxAmt).trim() !== '') {
      const fa = parseFloat(d.fxAmt);
      if (!(fa > 0)) return alert('Enter a valid actual amount, or leave it blank.');
      if (d.fxCur === d.cur) return alert('The actual amount must be in a different currency from the expense.');
      o.fx = { cur: d.fxCur, amt: fa }; ls.set('fxcur', d.fxCur);
    }
    try {
      const nid = id || rid();
      await db.collection('bills').doc(nid).set(o);
      if (!tripId) addHist('b', nid, name);
      back();
    } catch (e) { alert('Could not save: ' + e.message); }
  };
  const scanFile = async f => {
    scanning = 'Preparing photo...'; draw();
    try {
      const [T, cv] = await Promise.all([loadTess(), prepPhoto(f)]);
      const r = await T.recognize(cv, 'eng', { logger: m => { if (m.status === 'recognizing text' && scanHook === scanFile) { const e = document.getElementById('scm'); if (e) e.textContent = 'Reading receipt ' + Math.round(m.progress * 100) + '%'; } } });
      if (scanHook !== scanFile) return;
      const rows = parseReceipt(r.data.text);
      d.items = d.items.filter(x => x.n || x.p).concat(rows.map(x => ({ n: x.n, p: x.p, c: [] })));
      if (!d.items.length) d.items = [{ n: '', p: '', c: [] }];
      scanning = rows.length ? rows.length + ' items added. Check names and prices below.' : 'No items found. Try a flatter, brighter photo, or add items by hand.';
    } catch (e) { if (scanHook !== scanFile) return; scanning = 'Scan failed: ' + e.message; }
    draw();
  };
  scanHook = scanFile;
  const tg = (arr, n) => { const i = arr.indexOf(n); if (i < 0) arr.push(n); else arr.splice(i, 1); };
  draw();
  on({
    mode: el => { d.mode = el.dataset.v; ui = { menu: false, who: null }; draw(); },
    menu: () => { ui.menu = !ui.menu; draw(); },
    how: el => { d.how = el.dataset.v; draw(); },
    all: () => { const M = members(); d.even = M.every(m => d.even.includes(m)) ? [] : [...M]; draw(); },
    ev: el => { tg(d.even, el.dataset.n); draw(); },
    who: el => { const i = +el.dataset.i; ui.who = ui.who === i ? null : i; draw(); },
    wt: el => { tg(d.items[ui.who].c, el.dataset.n); draw(); },
    wa: () => { const M = members(), it = d.items[ui.who]; it.c = M.every(m => it.c.includes(m)) ? [] : [...M]; draw(); },
    wd: () => { ui.who = null; draw(); },
    addrow: () => { d.items.push({ n: '', p: '', c: [] }); draw(); },
    rmv: el => { d.items.splice(+el.dataset.i, 1); if (!d.items.length) d.items.push({ n: '', p: '', c: [] }); ui.who = null; draw(); },
    cam: () => document.getElementById('rcam').click(),
    gal: () => document.getElementById('rgal').click(),
    save,
    del: () => { if (confirm('Delete this expense for everyone?')) db.collection('bills').doc(id).delete().then(() => { ls.set('hist', ls.get('hist', []).filter(x => x.id !== id)); back(); }); }
  });
  app.oninput = e => {
    const t = e.target, f = t.dataset.f;
    if (!f || t.tagName === 'SELECT') return;
    if (f === 'pct' || f === 'amt') d[f][t.dataset.n] = parseFloat(t.value) || 0;
    else if (f === 'in') d.items[+t.dataset.i].n = t.value;
    else if (f === 'ip') d.items[+t.dataset.i].p = t.value;
    else d[f] = t.value;
    hint();
  };
  app.onchange = e => { const t = e.target; if (t.tagName === 'SELECT' && t.dataset.f) { d[t.dataset.f] = t.value; draw(); } };
  app.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('item')) { e.preventDefault(); e.target.click(); } };
}

// ---------- start ----------
['rcam', 'rgal'].forEach(i => document.getElementById(i).onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f && scanHook) scanHook(f); });
if (CFG.projectId === 'PASTE') {
  app.innerHTML = '<div class="card"><h2>One more step</h2><p>Open <b>index.html</b>, find <b>CFG</b> near the top of the script, and paste in your Firebase web app config.</p></div>';
} else {
  firebase.initializeApp(CFG);
  db = firebase.firestore();
  FV = firebase.firestore.FieldValue;
  route();
}
</script>
